import groovy.xml.XmlSlurper

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// This project's pubspec.yaml pins several plugins (cloud_firestore, firebase_auth, ...)
// from before AGP 8 made `namespace` mandatory and disabled custom BuildConfig fields
// by default. Patch both in for every Android library module that needs it.
subprojects {
    project.plugins.withId("com.android.library") {
        project.android {
            buildFeatures {
                buildConfig = true
            }
            if (namespace == null) {
                def manifest = new XmlSlurper().parse(project.file("src/main/AndroidManifest.xml"))
                namespace manifest.@package.text()
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
